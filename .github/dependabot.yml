version: 2
updates:
  # npm, not bun, DELIBERATELY. Dependabot's bun support parses only
  # bun.lock lockfileVersion 1, and Bun writes 2 -- so every run failed with
  # "Unsupported bun.lock 'lockfileVersion' 2" and NO dependency update has been
  # proposed for this repo since the Bun migration. Security alerts kept working
  # (they are dependency-graph based); it was automated remediation that was dead,
  # which made "0 open PRs" read as healthy when it partly meant "cannot open one".
  #
  # There is no package-lock.json here, so the npm ecosystem updates package.json
  # ranges only and bun.lock stays the project's authoritative lockfile --
  # regenerated by `bun install` when a bump lands, never by Dependabot. That
  # avoids carrying two lockfiles, which would be a second source of truth.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies, npm]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
